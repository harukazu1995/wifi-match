<script>

window.logoSvg=calmLogo;
document.querySelector('.logo').innerHTML=calmLogo();
var _A=window.A;window.A=function(n){return _A(n).replace(/#D4AF37/g,'#B59B6E').replace(/#F1D88A/g,'#D8C7A4')};

};
var _op=window.opening;
window.opening=function(){_op();var s=document.querySelector('#open .sl');if(s)s.innerHTML=calmLogo();var t=document.querySelector('#open .ss');if(t)t.textContent='同じWiFiの人と、つながろう。'};
document.querySelector('.logo').onclick=window.opening;

<style>
/* ===== 広告（見本）: 下のバナー + 4回タブを切り替えるごとに全画面広告 ===== */
#adbar{flex:none;display:flex;align-items:center;gap:10px;height:54px;margin:0;padding:0 12px;background:#161616;border-top:1px solid var(--line);position:relative}
#adbar .adm{width:38px;height:38px;border-radius:9px;border:1px solid #3A362C;background:#1A1A1A;display:flex;align-items:center;justify-content:center;color:var(--goldl);font-size:18px;flex:none}
#adbar .adt{flex:1;min-width:0}
#adbar .adt b{display:block;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#adbar .adt span{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#adbar .adb{flex:none;font-size:12px;border:1px solid #5A5242;color:var(--goldl);border-radius:8px;padding:6px 10px}
#adbar .adl{position:absolute;top:2px;left:12px;font-size:9px;letter-spacing:.1em;color:#6F6A60;background:#161616;padding:0 4px;transform:translateY(-50%);border:1px solid var(--line);border-radius:4px}
.fab{bottom:140px!important}
#adfull{position:absolute;inset:0;z-index:60;background:#0E0E0E;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#adfull.on{display:flex}
#adfull .adl2{position:absolute;top:16px;left:16px;font-size:11px;letter-spacing:.12em;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
#adfull .x{position:absolute;top:12px;right:14px;min-width:56px;padding:0 12px;height:36px;border-radius:18px;border:1px solid #3A362C;background:#1A1A1A;color:var(--sub);font-size:13px}
#adfull .x.rdy{color:var(--ink);border-color:#5A5242}
#adfull .big{width:96px;height:96px;border-radius:24px;border:1px solid #3A362C;background:#1A1A1A;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:22px}
#adfull h3{font-size:20px;font-weight:600;margin-bottom:8px}
#adfull p{font-size:13px;color:#BDB8AE;margin-bottom:22px;line-height:1.7}
#adfull .btn{width:70%;max-width:260px}
#adfull .nt{position:absolute;bottom:18px;font-size:10px;color:#6F6A60;line-height:1.5;padding:0 24px}
</style>
<script>
(function(){
var app=document.getElementById('app'),nav=document.getElementById('nav');
var bar=document.createElement('div');bar.id='adbar';
bar.innerHTML='<span class="adl">広告</span><div class="adm">☕</div><div class="adt"><b>はじめての豆、半額でお試し</b><span>近くのコーヒー店からのお知らせ（見本）</span></div><div class="adb">見る</div>';
app.insertBefore(bar,nav);
var full=document.createElement('div');full.id='adfull';
full.innerHTML='<span class="adl2">広告</span><button class="x" id="adx">3</button><div class="big">☕</div><h3>はじめての豆、半額でお試し</h3><p>近くのコーヒー店からのお知らせです。<br>（これは見本の広告です）</p><button class="btn" style="font-size:15px;height:48px;border-radius:24px;border:0;padding:0 20px">くわしく見る</button><div class="nt">本物のアプリでは、4回タブを切り替えるごとに1回まで。あわせて2分に1回までです。</div>';
app.appendChild(full);
var n=0,t=null;
function close(){full.classList.remove('on');clearInterval(t)}
document.getElementById('adx').onclick=function(){if(this.classList.contains('rdy'))close()};
nav.addEventListener('click',function(e){
  if(!e.target.closest('button'))return;
  n++;
  if(n%4!==0)return;
  var x=document.getElementById('adx'),s=3;x.textContent=s;x.classList.remove('rdy');full.classList.add('on');
  clearInterval(t);t=setInterval(function(){s--;if(s<=0){clearInterval(t);x.textContent='閉じる';x.classList.add('rdy')}else x.textContent=s},1000);
},true);
window.showFullAd=function(){n=3;};
})();
</script>
