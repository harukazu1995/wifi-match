name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android プロジェクトを生成
        run: flutter create --platforms=android --org com.wifimatch --project-name wifi_match .

      - name: WiFi通信の権限を追加
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: コード検査
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: テスト
        run: flutter test

      - name: APK をビルド
        run: flutter build apk --release

      - name: ファイル名を整える
        run: cp build/app/outputs/flutter-apk/app-release.apk WiFiMatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiMatch-apk
          path: WiFiMatch.apk

      - name: Releases で公開（v から始まるタグを push したとき）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WiFiMatch.apk
