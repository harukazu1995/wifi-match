name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android プロジェクトを生成
        run: flutter create --platforms=android --org com.wifimatch --project-name wifi_match .

      - name: WiFi通信の権限を追加
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: コード検査
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: テスト（テスト相手との実際の通信テストを含む）
        run: flutter test

      - name: APK をビルド
        run: flutter build apk --release

      - name: ファイル名を整える
        run: cp build/app/outputs/flutter-apk/app-release.apk WiFiMatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: WiFiMatch.apk

  test-buddy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: テスト相手を Windows 用 exe にする
        run: |
          pip install pyinstaller
          pyinstaller --onefile --console --name TestBuddy tool/test_buddy.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TestBuddy.exe

  release:
    needs: [android, test-buddy]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: ダウンロードページに公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: WiFi Match ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          body: |
            ## スマホに入れる（Android）
            1. 下の **WiFiMatch.apk** をタップしてダウンロード
            2. ダウンロードしたファイルを開く
            3. 「提供元不明のアプリ」の許可を求められたら許可してインストール

            同じWiFiに接続している、このアプリを入れた人同士で見つけ合えます。

            ## スマホが1台しかないときの動作確認（Windows PC）
            **TestBuddy.exe** をスマホと同じWiFiにつないだPCでダブルクリックすると、
            「テスト相手」としてスマホのアプリに表示されます。いいねを返したり、チャットに返信したりします。
            （初回に Windows のファイアウォールの確認が出たら「プライベート ネットワーク」を許可してください）
          files: |
            WiFiMatch.apk
            TestBuddy.exe
