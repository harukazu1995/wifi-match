name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android プロジェクトを生成
        run: flutter create --platforms=android --org com.wifimatch --project-name wifi_match .

      - name: WiFi通信の権限を追加
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: コード検査
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: テスト（テスト相手との実際の通信テストを含む）
        run: flutter test

      - name: APK をビルド（コード圧縮は広告ライブラリの部品を壊すため無効）
        run: flutter build apk --release --no-shrink

      - name: ファイル名を整える
        run: cp build/app/outputs/flutter-apk/app-release.apk WiFiMatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: WiFiMatch.apk

  bundle:
    runs-on: ubuntu-latest
    env:
      SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
    steps:
      - uses: actions/checkout@v4

      - name: 署名鍵が登録されているか確認
        id: key
        run: |
          if [ -n "$SIGNING_BUNDLE" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            KS_B64=$(printf '%s' "$SIGNING_BUNDLE" | sed -n 1p | tr -d '\r\n ')
            KS_PASS=$(printf '%s' "$SIGNING_BUNDLE" | sed -n 2p | tr -d '\r\n')
            KS_ALIAS=$(printf '%s' "$SIGNING_BUNDLE" | sed -n 3p | tr -d '\r\n')
            echo "::add-mask::$KS_PASS"
            {
              echo "KEYSTORE_B64=$KS_B64"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KS_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "署名鍵が未登録のため、ストア用 AAB は作りません（APK には影響しません）"
          fi

      - uses: actions/setup-java@v4
        if: steps.key.outputs.have == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.have == 'true'
        with:
          channel: stable
          cache: true

      - name: 署名鍵を取り出して確認
        if: steps.key.outputs.have == 'true'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.pfx"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload-keystore.pfx" >> "$GITHUB_ENV"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/upload-keystore.pfx" -storepass:env ANDROID_KEYSTORE_PASSWORD
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/upload-keystore.pfx" -storepass:env ANDROID_KEYSTORE_PASSWORD | grep PrivateKeyEntry | head -n 1 | cut -d, -f1)
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Android プロジェクトを生成して署名を設定
        if: steps.key.outputs.have == 'true'
        run: |
          flutter create --platforms=android --org com.wifimatch --project-name wifi_match .
          python3 tool/patch_android.py
          flutter pub get

      - name: ストア用 AAB をビルド
        if: steps.key.outputs.have == 'true'
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=PROXIMITY_FREE_BETA=false
          cp build/app/outputs/bundle/release/app-release.aab WiFiMatch-store.aab

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.have == 'true'
        with:
          name: bundle
          path: WiFiMatch-store.aab

  test-buddy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: テスト相手を Windows 用 exe にする
        run: |
          pip install pyinstaller
          pyinstaller --onefile --console --name TestBuddy tool/test_buddy.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TestBuddy.exe

  release:
    needs: [android, test-buddy, bundle]
    if: ${{ always() && needs.android.result == 'success' && needs.test-buddy.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: ダウンロードページに公開
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: WiFi Match ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          body: |
            ## スマホに入れる（Android）
            1. 下の **WiFiMatch.apk** をタップしてダウンロード
            2. ダウンロードしたファイルを開く
            3. 「提供元不明のアプリ」の許可を求められたら許可してインストール

            同じWiFiに接続している、このアプリを入れた人同士で見つけ合えます。

            ## スマホが1台しかないときの動作確認（Windows PC）
            **TestBuddy.exe** をスマホと同じWiFiにつないだPCでダブルクリックすると、
            「テスト相手」としてスマホのアプリに表示されます。いいねを返したり、チャットに返信したりします。
            （初回に Windows のファイアウォールの確認が出たら「プライベート ネットワーク」を許可してください）
          files: |
            WiFiMatch.apk
            TestBuddy.exe
            WiFiMatch-store.aab

  # 起動確認：エミュレーターでアプリを開き、落ちた場合のエラー記録を表示する（公開には影響しない）
  smoke:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: KVM を有効にする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: エミュレーターで起動して記録を取る
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r WiFiMatch.apk
            adb logcat -c
            adb shell monkey -p com.wifimatch.wifi_match -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "===== PROCESS ALIVE? ====="
            adb shell pidof com.wifimatch.wifi_match || echo "NOT RUNNING"
            echo "===== CRASH LOG ====="
            adb logcat -d -b crash || true
            echo "===== FATAL / ERROR LINES ====="
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|Caused by|Process: com.wifimatch|IllegalState|ClassNotFound|NoClassDef|VerifyError|MobileAds|Ads" | head -n 120 || true
